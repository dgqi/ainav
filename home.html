<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 工具导航</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f6f8fc;
            color: #1e293b;
            min-height: 100vh;
            padding: 0 20px 60px;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 1320px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0 30px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0f172a;
        }
        .logo i {
            background: linear-gradient(145deg, #6366f1, #8b5cf6);
            padding: 12px;
            border-radius: 18px;
            font-size: 1.6rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }
        .logo span {
            background: linear-gradient(145deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 1.1rem;
            color: #64748b;
            max-width: 500px;
        }

        /* ===== 搜索框 ===== */
        .search-wrapper {
            width: 100%;
            max-width: 640px;
            margin: 24px auto 10px;
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            pointer-events: none;
        }
        .search-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border: none;
            border-radius: 60px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(148, 163, 184, 0.15);
            font-size: 1rem;
            transition: box-shadow 0.25s, transform 0.2s;
            outline: none;
            color: #1e293b;
        }
        .search-wrapper input::placeholder {
            color: #94a3b8;
        }
        .search-wrapper input:focus {
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.18), 0 0 0 2px #6366f1;
            transform: scale(1.01);
        }
        .search-wrapper .clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 30px;
            transition: background 0.2s;
            display: none;
        }
        .search-wrapper .clear-btn:hover {
            background: #f1f5f9;
            color: #475569;
        }
        .search-wrapper .clear-btn.visible {
            display: block;
        }

        /* ===== 分类标签 ===== */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 12px;
            margin: 32px 0 20px;
        }
        .categories .cat-btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            background: #ffffff;
            color: #475569;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(148, 163, 184, 0.15);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .categories .cat-btn i {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .categories .cat-btn:hover {
            background: #f8fafc;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(148, 163, 184, 0.25);
            transform: translateY(-2px);
        }
        .categories .cat-btn.active {
            background: #6366f1;
            color: #fff;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
            border-color: transparent;
        }
        .categories .cat-btn.active i {
            color: #fff;
        }

        /* ===== 统计信息 ===== */
        .stats {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }
        .stats span {
            font-weight: 600;
            color: #475569;
        }

        /* ===== 工具卡片网格 ===== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
            margin-top: 8px;
        }

        .tool-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 20px 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(148, 163, 184, 0.08);
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: default;
        }
        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(148, 163, 184, 0.12);
        }

        .tool-card .icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 16px;
            flex-shrink: 0;
            background: #e2e8f0;
            /* fallback */;
        }
        .tool-card .icon-wrap i {
            font-size: 1.6rem;
        }

        .tool-card .tool-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tool-card .tool-name .badge {
            font-size: 0.65rem;
            font-weight: 500;
            background: #eef2ff;
            color: #6366f1;
            padding: 2px 10px;
            border-radius: 30px;
            letter-spacing: 0.2px;
        }

        .tool-card .tool-desc {
            font-size: 0.9rem;
            color: #64748b;
            margin: 6px 0 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tool-card .tool-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }
        .tool-card .tool-footer .category-tag {
            font-size: 0.75rem;
            color: #94a3b8;
            background: #f8fafc;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #f1f5f9;
        }
        .tool-card .tool-footer .visit-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6366f1;
            transition: gap 0.2s;
            padding: 4px 8px;
            border-radius: 30px;
            background: transparent;
            transition: all 0.2s;
        }
        .tool-card .tool-footer .visit-link i {
            font-size: 0.75rem;
            transition: transform 0.2s;
        }
        .tool-card .tool-footer .visit-link:hover {
            background: #eef2ff;
            gap: 10px;
        }
        .tool-card .tool-footer .visit-link:hover i {
            transform: translateX(3px);
        }

        /* ===== 无结果状态 ===== */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px 40px;
            color: #94a3b8;
        }
        .no-results i {
            font-size: 2.8rem;
            color: #cbd5e1;
            margin-bottom: 16px;
            display: block;
        }
        .no-results h3 {
            font-weight: 500;
            color: #475569;
            margin-bottom: 6px;
        }
        .no-results p {
            font-size: 0.95rem;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 28px;
            border-top: 1px solid #e9edf3;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .footer a {
            color: #6366f1;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .header {
                padding-top: 28px;
            }
            .logo {
                font-size: 1.6rem;
            }
            .logo i {
                padding: 10px;
                font-size: 1.3rem;
                border-radius: 14px;
            }
            .subtitle {
                font-size: 1rem;
            }
            .search-wrapper input {
                padding: 14px 16px 14px 46px;
                font-size: 0.95rem;
            }
            .categories .cat-btn {
                padding: 6px 16px;
                font-size: 0.8rem;
            }
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 16px;
            }
            .tool-card {
                padding: 18px 16px 18px;
            }
            .tool-card .icon-wrap {
                width: 44px;
                height: 44px;
                font-size: 1.3rem;
            }
            .tool-card .tool-name {
                font-size: 1rem;
            }
        }

        @media (max-width: 440px) {
            .tools-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .tool-card .tool-desc {
                font-size: 0.8rem;
                -webkit-line-clamp: 2;
            }
            .tool-card .tool-footer .category-tag {
                font-size: 0.65rem;
                padding: 1px 10px;
            }
            .tool-card .tool-footer .visit-link {
                font-size: 0.75rem;
                padding: 2px 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <span>AI 导航</span>
            </div>
            <p class="subtitle">精选人工智能工具 · 一站式发现</p>

            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索工具名称、描述或分类…" autocomplete="off" />
                <button class="clear-btn" id="clearBtn" aria-label="清除搜索">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
        </header>

        <!-- ===== 分类标签 ===== -->
        <div class="categories" id="categoryFilter">
            <button class="cat-btn active" data-cat="all">
                <i class="fas fa-th-large"></i> 全部
            </button>
            <!-- 动态由 JS 生成 -->
        </div>

        <!-- ===== 统计 ===== -->
        <div class="stats" id="stats">
            共 <span id="totalCount">0</span> 个工具
        </div>

        <!-- ===== 卡片网格 ===== -->
        <div class="tools-grid" id="toolsGrid">
            <!-- 由 JS 渲染 -->
        </div>

        <!-- ===== 底部 ===== -->
        <footer class="footer">
            <p>✨ 收集实用 AI 工具 · 持续更新 &nbsp;|&nbsp; 建议 <a href="#">提交工具</a></p>
        </footer>
    </div>

    <script>
        // ============================================================
        //  数据
        // ============================================================
        const tools = [{
            id: 1,

            color: '#10a37f',
            url: 'https://chat.openai.com/'
        }, {
            id: 2,
            name: 'Claude',
            desc: 'Anthropic 推出的高情商 AI 助手，擅长长上下文推理与代码分析。',
            category: '聊天助手',
            icon: 'fa-brain',
            color: '#7c3aed',
            url: 'https://claude.ai/'
        }, {
            id: 3,
            name: 'Midjourney',
            desc: '顶级 AI 图像生成器，通过文本描述创造精美艺术风格图片。',
            category: '图像生成',
            icon: 'fa-palette',
            color: '#f97316',
            url: 'https://www.midjourney.com/'
        }, {
            id: 4,
            name: 'Stable Diffusion',
            desc: '开源文本到图像模型，支持高度自定义和本地部署。',
            category: '图像生成',
            icon: 'fa-image',
            color: '#2563eb',
            url: 'https://stability.ai/'
        }, {
            id: 5,
            name: 'DALL·E 3',
            desc: 'OpenAI 的图像生成模型，理解复杂指令，细节丰富。',
            category: '图像生成',
            icon: 'fa-paintbrush',
            color: '#8b5cf6',
            url: 'https://openai.com/dall-e-3'
        }, {
            id: 6,
            name: 'Sora',
            desc: 'OpenAI 文本生成视频模型，可生成长达一分钟的高清视频。',
            category: '视频制作',
            icon: 'fa-film',
            color: '#dc2626',
            url: 'https://openai.com/sora'
        }, {
            id: 7,
            name: 'Runway Gen-2',
            desc: 'AI 视频生成与编辑工具，支持文本生成视频、风格迁移。',
            category: '视频制作',
            icon: 'fa-video',
            color: '#7c3aed',
            url: 'https://runwayml.com/'
        }, {
            id: 8,
            name: 'GitHub Copilot',
            desc: 'AI 编程助手，实时提供代码建议，支持多种语言。',
            category: '编程辅助',
            icon: 'fa-code',
            color: '#181717',
            url: 'https://github.com/features/copilot'
        }, {
            id: 9,
            name: 'Tabnine',
            desc: 'AI 代码补全工具，支持主流 IDE，隐私友好。',
            category: '编程辅助',
            icon: 'fa-terminal',
            color: '#2d6a4f',
            url: 'https://www.tabnine.com/'
        }, {
            id: 10,
            name: 'Jasper',
            desc: 'AI 内容写作平台，适用于博客、广告、社交媒体文案。',
            category: '写作助手',
            icon: 'fa-feather-alt',
            color: '#d97706',
            url: 'https://www.jasper.ai/'
        }, {
            id: 11,
            name: 'Grammarly',
            desc: 'AI 语法检查与润色工具，提升英文写作质量。',
            category: '写作助手',
            icon: 'fa-pen-fancy',
            color: '#00b38a',
            url: 'https://www.grammarly.com/'
        }, {
            id: 12,
            name: 'Notion AI',
            desc: '集成在 Notion 中的 AI 助手，辅助写作、总结和头脑风暴。',
            category: '写作助手',
            icon: 'fa-sticky-note',
            color: '#37352f',
            url: 'https://www.notion.so/product/ai'
        }, {
            id: 13,
            name: 'Tableau',
            desc: 'AI 增强的数据可视化平台，智能分析并生成洞察。',
            category: '数据分析',
            icon: 'fa-chart-line',
            color: '#1f77b4',
            url: 'https://www.tableau.com/'
        }, {
            id: 14,
            name: 'Suno AI',
            desc: 'AI 音乐生成平台，根据文本描述创作完整歌曲。',
            category: '音乐生成',
            icon: 'fa-music',
            color: '#b91c1c',
            url: 'https://suno.com/'
        }, {
            id: 15,
            name: 'Otter.ai',
            desc: 'AI 会议记录与转录工具，实时生成文字稿和摘要。',
            category: '办公效率',
            icon: 'fa-microphone',
            color: '#0d9488',
            url: 'https://otter.ai/'
        }, {
            id: 16,
            name: 'Gamma',
            desc: 'AI 演示文稿生成工具，快速创建幻灯片和文档。',
            category: '办公效率',
            icon: 'fa-presentation',
            color: '#7c3aed',
            url: 'https://gamma.app/'
        }, {
            id: 17,
            name: 'Perplexity AI',
            desc: 'AI 搜索问答引擎，引用来源，提供可靠答案。',
            category: '聊天助手',
            icon: 'fa-compass',
            color: '#2563eb',
            url: 'https://www.perplexity.ai/'
        }, {
            id: 18,
            name: 'Pika',
            desc: '文本生成视频工具，风格多样，适合创意短片。',
            category: '视频制作',
            icon: 'fa-play-circle',
            color: '#e11d48',
            url: 'https://pika.art/'
        }, {
            id: 19,
            name: 'Adobe Firefly',
            desc: 'Adobe 的创意生成 AI，集成在 Photoshop 等工具中。',
            category: '图像生成',
            icon: 'fa-fire',
            color: '#ff3b30',
            url: 'https://www.adobe.com/sensei/generative-ai/firefly.html'
        }, {
            id: 20,
            name: 'Replit AI',
            desc: '在线 IDE 中的 AI 编程助手，辅助编写和调试代码。',
            category: '编程辅助',
            icon: 'fa-laptop-code',
            color: '#d97706',
            url: 'https://replit.com/'
        }, {
            id: 21,
            name: 'agent-qa',
            desc: 'vostride 的网页与 Android/iOS 测试智能体，具备 memidex 持久记忆、经验证的自我改进、MCP 接入和可回看的运行证据；模型费用另计。',
            category: '编程辅助',
            icon: 'fa-code',
            color: '#2563eb',
            url: 'https://vostride.com'
        }];

        // ============================================================
        //  状态
        // ============================================================
        let currentCategory = 'all';
        let searchQuery = '';

        // DOM 引用
        const grid = document.getElementById('toolsGrid');
        const stats = document.getElementById('totalCount');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const categoryContainer = document.getElementById('categoryFilter');

        // ============================================================
        //  辅助函数
        // ============================================================
        function getCategories() {
            const set = new Set(tools.map(t => t.category));
            return Array.from(set).sort();
        }

        function getFilteredTools() {
            return tools.filter(tool => {
                // 分类过滤
                if (currentCategory !== 'all' && tool.category !== currentCategory) return false;
                // 搜索过滤
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.trim().toLowerCase();
                    const match = tool.name.toLowerCase().includes(q) ||
                        tool.desc.toLowerCase().includes(q) ||
                        tool.category.toLowerCase().includes(q);
                    if (!match) return false;
                }
                return true;
            });
        }

        // 随机浅色背景 (用于图标占位)
        function getIconBgColor(color) {
            return color || '#e2e8f0';
        }

        // ============================================================
        //  渲染
        // ============================================================
        function renderCategories() {
            // 保留 "全部" 按钮，其他动态添加
            const allBtn = categoryContainer.querySelector('[data-cat="all"]');
            // 清除除 "全部" 以外的按钮
            const others = categoryContainer.querySelectorAll('[data-cat]:not([data-cat="all"])');
            others.forEach(el => el.remove());

            const cats = getCategories();
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.dataset.cat = cat;
                // 给每个分类配一个小图标
                const iconMap = {
                    '聊天助手': 'fa-comment',
                    '图像生成': 'fa-image',
                    '视频制作': 'fa-film',
                    '编程辅助': 'fa-code',
                    '写作助手': 'fa-pen-fancy',
                    '数据分析': 'fa-chart-pie',
                    '音乐生成': 'fa-music',
                    '办公效率': 'fa-briefcase'
                };
                const icon = iconMap[cat] || 'fa-tag';
                btn.innerHTML = `<i class="fas ${icon}"></i> ${cat}`;
                if (currentCategory === cat) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    currentCategory = cat;
                    // 高亮
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTools();
                });
                categoryContainer.appendChild(btn);
            });
        }

        function renderTools() {
            const filtered = getFilteredTools();
            // 更新统计
            stats.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>没有找到匹配的工具</h3>
                        <p>试试调整搜索词或分类</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(tool => {
                const iconColor = tool.color || '#94a3b8';
                html += `
                    <div class="tool-card" data-id="${tool.id}">
                        <div class="icon-wrap" style="background:${iconColor};">
                            <i class="fas ${tool.icon}"></i>
                        </div>
                        <div class="tool-name">
                            ${tool.name}
                            <span class="badge">${tool.category}</span>
                        </div>
                        <p class="tool-desc">${tool.desc}</p>
                        <div class="tool-footer">
                            <span class="category-tag"><i class="fas fa-folder-open" style="margin-right:4px;font-size:0.65rem;"></i> ${tool.category}</span>
                            <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="visit-link">
                                访问 <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // ============================================================
        //  搜索逻辑
        // ============================================================
        function handleSearch() {
            searchQuery = searchInput.value;
            // 显示/隐藏清除按钮
            clearBtn.classList.toggle('visible', searchQuery.length > 0);
            renderTools();
        }

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            // 设置默认分类
            currentCategory = 'all';
            // 渲染分类
            renderCategories();
            // 渲染工具
            renderTools();

            // 搜索事件
            searchInput.addEventListener('input', handleSearch);
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                handleSearch();
                searchInput.focus();
            });

            // 按 Enter 时保持
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') e.preventDefault();
            });

            // 点击"全部"按钮的特殊处理（在渲染分类时已绑定，但需确保激活状态）
            const allBtn = categoryContainer.querySelector('[data-cat="all"]');
            if (allBtn) {
                allBtn.addEventListener('click', () => {
                    currentCategory = 'all';
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    renderTools();
                });
            }

            // 额外优化：点击外部可关闭
            document.addEventListener('click', function(e) {
                // 点击卡片上的链接不额外处理
            });
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
